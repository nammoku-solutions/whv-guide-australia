name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate:content

      - name: Validate articles
        run: npm run validate:articles

      - name: Test content tools
        run: npm run test:content

      - name: Test utility tools
        run: npm run test:tools

      - name: Test and package standalone AWS monitor
        run: |
          node --import tsx --test infra/whv-monitor/core.test.mts
          node infra/whv-monitor/build.mjs "$RUNNER_TEMP/whv-monitor.template.json"
