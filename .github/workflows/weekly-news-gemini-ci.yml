name: Test Weekly Gemini News Research

on:
  pull_request:
    paths:
      - "lib/monitor/external/weeklyResearch.ts"
      - "scripts/research-weekly-news.mts"
      - "scripts/weekly-news-research.test.mts"
      - ".github/workflows/weekly-news-gemini.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:weekly-research
