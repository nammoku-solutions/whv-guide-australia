# AI ナレッジベースのインデックス更新。
#
# 記事・AIモジュールが main に反映されたときに、変更 chunk のみ再埋め込みして
# Supabase を更新する。無関係なコミットでは実行しない（paths でフィルタ）。
#
# 必要なリポジトリ Secrets（Settings -> Secrets and variables -> Actions）:
#   GEMINI_API_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   AI_EMBEDDING_VERSION            (任意。未設定なら 'v1')
# シークレットはログに出力しない。
name: AI Index

on:
  push:
    branches: [main]
    paths:
      - "lib/content/articles/**"
      - "lib/content/**"
      - "lib/ai/**"
      - "scripts/ai-index.mts"
  workflow_dispatch:
    inputs:
      reindex:
        description: "全 chunk を再埋め込み（埋め込みモデル更新時）"
        type: boolean
        default: false

concurrency:
  group: ai-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run indexing (changed chunks only)
        if: ${{ github.event_name == 'push' || inputs.reindex != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_EMBEDDING_VERSION: ${{ secrets.AI_EMBEDDING_VERSION }}
        run: npm run ai:index

      - name: Full reindex
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reindex == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_EMBEDDING_VERSION: ${{ secrets.AI_EMBEDDING_VERSION }}
        run: npm run ai:reindex
