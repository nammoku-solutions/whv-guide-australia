# WHV Compass weekly official-news research using Gemini + Google Search Grounding.
#
# Schedule is GitHub Actions UTC. Brisbane is UTC+10 year-round, so
# Sunday 19:00 Australia/Brisbane = Sunday 09:00 UTC.
#
# TEMPORARY bootstrap trigger: push to main for this workflow's own files.
# Remove after the first successful E2E run; normal operation is schedule + manual dispatch only.
#
# Required repository Secrets (already used by existing news workflows):
#   GEMINI_API_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   AI_EMBEDDING_VERSION (optional)
#
# Optional repository Variables:
#   WEEKLY_NEWS_RESEARCH_MODEL (default gemini-2.5-flash)
#   WEEKLY_NEWS_RESEARCH_TIMEOUT_MS (default 90000 per batch)
#   WEEKLY_NEWS_RESEARCH_BATCH_SIZE (default 4 sources)
#   WEEKLY_NEWS_RESEARCH_RETRIES (default 1 retry per batch)
#   NEWS_AUTO_PUBLISH_LOW_RISK (default true)
#   NEWS_AUTO_PUBLISH_HIGH_RISK (default false)
#   EXTERNAL_NEWS_BATCH (default 10)
name: WHV Weekly News - Gemini Search

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly-news-gemini.yml"
      - "scripts/research-weekly-news.mts"
      - "lib/monitor/external/weeklyResearch.ts"
      - "package.json"

concurrency:
  group: whv-weekly-news-gemini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify weekly research parser and provenance
        run: npm run test:weekly-research

      - name: Research official updates with Gemini + Google Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEEKLY_NEWS_RESEARCH_MODEL: ${{ vars.WEEKLY_NEWS_RESEARCH_MODEL }}
          WEEKLY_NEWS_RESEARCH_TIMEOUT_MS: ${{ vars.WEEKLY_NEWS_RESEARCH_TIMEOUT_MS }}
          WEEKLY_NEWS_RESEARCH_BATCH_SIZE: ${{ vars.WEEKLY_NEWS_RESEARCH_BATCH_SIZE }}
          WEEKLY_NEWS_RESEARCH_RETRIES: ${{ vars.WEEKLY_NEWS_RESEARCH_RETRIES }}
        run: npm run news:research

      - name: Process newly queued candidates through existing pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_EMBEDDING_VERSION: ${{ secrets.AI_EMBEDDING_VERSION }}
          NEWS_AUTO_PUBLISH_LOW_RISK: ${{ vars.NEWS_AUTO_PUBLISH_LOW_RISK }}
          NEWS_AUTO_PUBLISH_HIGH_RISK: ${{ vars.NEWS_AUTO_PUBLISH_HIGH_RISK }}
          EXTERNAL_NEWS_BATCH: ${{ vars.EXTERNAL_NEWS_BATCH }}
        run: npm run news:candidates
